<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>问答笔记</title>
<style>
*{box-sizing:border-box} [hidden]{display:none!important} :root{color-scheme:light dark;--bg:var(--color-background-primary,#fff);--fg:var(--color-text-primary,#0d0d0d);--muted:var(--color-text-secondary,#6b6b6b);--line:var(--color-border-primary,#e5e5e5);--soft:var(--color-background-secondary,#f7f7f7);--accent:#1d6656;--yellow:#fff0b4}

:root[data-theme=light]{color-scheme:light;--bg:var(--color-background-primary,#fff);--fg:var(--color-text-primary,#0d0d0d);--muted:var(--color-text-secondary,#6b6b6b);--line:var(--color-border-primary,#e5e5e5);--soft:var(--color-background-secondary,#f7f7f7);--accent:#1d6656;--yellow:#fff0b4}

html{height:100%;overflow:hidden}body{margin:0;height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;color:var(--fg);background:var(--bg);font:14px/1.6 var(--font-sans,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif)}

button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}button.icon{border:0;font-size:20px;padding:2px 10px}
.refresh-icon{display:inline-block;line-height:1;transform-origin:center}.is-refreshing .refresh-icon{animation:refresh-spin .8s linear infinite}.is-refreshing{cursor:progress!important}@keyframes refresh-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.is-refreshing .refresh-icon{animation:none}}
header{display:flex;align-items:center;justify-content:space-between;padding:17px 18px 12px;border-bottom:1px solid var(--line)}

input,textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);padding:9px 11px}textarea{resize:vertical;min-height:100px}

.row strong{display:block;font-weight:600}.preview{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:5px;overflow-wrap:anywhere}
.meta{font-size:11px;color:var(--muted);margin-top:7px}.empty{padding:38px 10px;text-align:center;color:var(--muted)}
.question-record{margin:8px 0 24px}.question-time{color:var(--muted);font-size:12px;text-align:center;margin-bottom:12px}.question-bubble{display:block;width:fit-content;min-width:0;max-width:94%;margin-left:auto;padding:14px 20px;border:0;border-radius:22px;background:color-mix(in srgb,var(--fg) 6%,var(--bg));color:var(--fg);font-size:16px;font-weight:400;line-height:1.75;text-align:left;overflow-wrap:anywhere}button.question-bubble:hover{background:color-mix(in srgb,var(--fg) 9%,var(--bg))}.question-text{white-space:pre-wrap}.question-status{text-align:right;margin-top:6px}.question-bubble .attachment-list{margin-bottom:12px}.question-bubble .markdown p{white-space:pre-wrap}.question-bubble .markdown>:last-child{margin-bottom:0}
.section{margin-top:17px}h2{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 7px}.text{white-space:pre-wrap;overflow-wrap:anywhere}
.quote{border-left:3px solid var(--line);padding:0 0 0 14px}.markdown{font-size:16px;line-height:1.75;overflow-wrap:anywhere;white-space:normal;color:var(--fg)}

.markdown h1{font-size:1.5em}.markdown h2{font-size:1.25em}.markdown h3{font-size:1.125em}.markdown h4,.markdown h5,.markdown h6{font-size:1em}.markdown>:first-child{margin-top:0}.markdown>:last-child{margin-bottom:0}
.markdown ul,.markdown ol{padding-left:1.65em;margin:0 0 1.25em}.markdown li{margin:.4em 0;padding-left:.15em}.markdown li>p{margin:.5em 0}.markdown li>ul,.markdown li>ol{margin:.45em 0}.markdown blockquote{border-left:3px solid var(--line);padding-left:1em;color:var(--muted);margin:1.25em 0}.markdown blockquote>p:last-child{margin-bottom:0}
.markdown hr{border:0;border-top:1px solid var(--line);margin:1.5em 0}.markdown a{color:var(--color-text-info,#0969da);text-decoration:underline;text-underline-offset:3px}.markdown code{font-family:var(--font-mono,Consolas,ui-monospace,monospace);font-size:.875em;background:var(--soft);padding:.15em .35em;border-radius:5px;white-space:pre-wrap}
.code-block{background:var(--soft);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:1em 0}.code-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;color:var(--muted);font-size:12px;line-height:1.5;user-select:none}.code-head button{border:0;background:transparent;font-size:12px;padding:2px 0;color:inherit}.markdown pre{margin:0;padding:14px;overflow-x:auto;line-height:1.65;tab-size:4}.markdown pre code{white-space:pre;overflow-wrap:normal;display:block;background:none;padding:0;font-size:13px}
.markdown mark,.formula-mark{background:var(--yellow);color:inherit;border-radius:2px}.table-scroll{overflow-x:auto;max-width:100%;margin:1.25em 0}.markdown table{border-collapse:collapse;width:100%;font-size:14px;text-align:left}.markdown th,.markdown td{padding:9px 12px;border-bottom:1px solid var(--line);min-width:70px}.markdown th{font-weight:600;border-bottom-width:2px}.markdown tr:last-child td{border-bottom:0}.task-item{list-style:none;position:relative}.task-check{width:14px;height:14px;position:absolute;left:-1.5em;top:.55em;padding:0;accent-color:var(--accent)}
.formula{overflow-x:auto;max-width:100%}.formula .katex-display{margin:1em 0}.image-description{color:var(--muted)}.hljs-comment,.hljs-quote{color:var(--muted)}.hljs-keyword,.hljs-selector-tag,.hljs-literal{color:#a626a4}.hljs-string,.hljs-regexp{color:#287542}.hljs-number,.hljs-built_in,.hljs-attr{color:#986801}.hljs-title,.hljs-function .hljs-title{color:#245fb4}
[data-theme=dark] .hljs-keyword,[data-theme=dark] .hljs-selector-tag,[data-theme=dark] .hljs-literal{color:#d899e8}[data-theme=dark] .hljs-string,[data-theme=dark] .hljs-regexp{color:#98c379}[data-theme=dark] .hljs-number,[data-theme=dark] .hljs-built_in,[data-theme=dark] .hljs-attr{color:#e5c07b}[data-theme=dark] .hljs-title{color:#82b5f4}
.detail-head{display:flex;align-items:center;gap:10px;margin:0 0 14px}.detail-head button{flex-shrink:0;white-space:nowrap}.detail-head strong{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.candidate{padding:12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;cursor:pointer}
.candidate.selected{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.candidate:focus-visible{outline:2px solid var(--accent)}
label{display:block;margin:14px 0 6px;color:var(--muted);font-size:13px}footer{flex:none;padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
#message{margin:0 16px 10px;padding:9px 11px;border-radius:8px;background:var(--soft);font-size:12px;overflow-wrap:anywhere}#message:empty{display:none}
#message[data-kind=success]{border-left:3px solid var(--accent)}#message[data-kind=error]{border-left:3px solid #cc4545}#message button{margin-left:8px}
.row-wrap{position:relative;margin-bottom:9px}.row-wrap>.row{margin-bottom:0;padding-right:46px}.row-more{border:0;background:transparent;padding:3px 8px;font-size:19px;line-height:1.3;flex-shrink:0}.row-wrap>.row-more{position:absolute;right:7px;top:9px}
.context-menu{position:fixed;z-index:200;min-width:154px;max-width:calc(100vw - 16px);padding:5px;border:1px solid var(--line);border-radius:10px;background:var(--bg);box-shadow:0 5px 24px #0002}.menu-item{display:block;text-align:left;width:100%;border:0;border-radius:6px;padding:9px 12px}.danger{color:var(--color-text-danger,#c33)}
.list-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.list-tools .list-intro{margin:0}.management-card{border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:9px}.management-card .row{border:0;padding:0 36px 0 0}.management-card>.quiet{margin-top:10px}.management-card .row-more{top:0;right:0}
.markdown .image-thumbnail{width:100%}.markdown .image-thumbnail-frame{margin-left:0;margin-right:auto}.question-bubble .image-thumbnail-frame{margin-left:auto;margin-right:0}
.list-intro{font-size:12px;color:var(--muted);margin:2px 0 12px}.session-head{display:flex;gap:8px;align-items:center;margin-bottom:8px}.session-head button{white-space:nowrap;flex-shrink:0}.session-head strong{min-width:0;overflow-wrap:anywhere;font-size:13px}.session-info{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}.session-info .meta{margin:0}.quiet{font-size:11px;padding:4px 6px;white-space:nowrap}.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}.pager .meta{margin:0}.capture-scope{font-size:12px;background:var(--soft);padding:8px 10px;border-radius:8px;overflow-wrap:anywhere}.selection-note{position:fixed;z-index:100;background:var(--accent);color:var(--bg);border-color:var(--accent);box-shadow:0 3px 14px #0002;white-space:nowrap}
.selection-note:hover{background:var(--accent);filter:brightness(.95)}
.attachment-list{display:grid;gap:12px;margin:0 0 16px}.image-attachment{display:block;min-width:0;max-width:100%;margin:10px 0}.image-thumbnail-frame{display:block;width:max-content;max-width:100%;margin-left:auto;padding:0;border:1px solid var(--line);border-radius:12px;background:transparent;overflow:hidden;line-height:0}.image-thumbnail-frame img{display:block;max-width:min(100%,240px);max-height:220px;width:auto;height:auto;object-fit:contain;user-select:none}button.image-thumbnail-frame{cursor:zoom-in}button.image-thumbnail-frame:hover{background:transparent}.image-scroll{display:block;overflow:auto;min-width:0;min-height:0;background:var(--soft);border:1px solid var(--line);border-radius:12px;scrollbar-gutter:stable both-edges;overscroll-behavior:contain;user-select:none;touch-action:none}.image-stage{display:grid;place-items:center}.image-stage img{display:block;max-width:none;max-height:none;margin:0;object-fit:contain;user-select:none}.image-scroll.can-pan{cursor:grab}.image-scroll.is-panning{cursor:grabbing}.image-tools{display:flex;flex-direction:column;gap:7px;padding-top:9px;user-select:none;font-size:12px;line-height:1.4}.image-zoom-row{display:flex;align-items:center;gap:8px;min-width:0}.image-tools button{font-size:12px;padding:5px 9px;white-space:nowrap}.image-tools .image-step{padding:4px 9px;font-size:17px;line-height:1.2}.image-zoom-slider{flex:1;min-width:40px;width:auto;padding:0;border:0;height:20px;accent-color:var(--accent);cursor:pointer}.image-percent{font-variant-numeric:tabular-nums;min-width:50px;text-align:right;white-space:nowrap}.image-zoom-actions{display:flex;gap:7px;flex-wrap:wrap}.image-zoom-hint{display:block;color:var(--muted);font-size:11px;line-height:1.5;margin-top:6px;user-select:none}.image-missing{padding:12px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.image-missing small{display:block;margin-top:5px}
.image-overlay{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:#0008;padding:12px}.image-preview-panel{width:100%;height:100%;min-height:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px}.image-preview-head{display:flex;align-items:center;gap:10px;flex-shrink:0}.image-preview-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted)}.image-preview-head button{flex-shrink:0;font-size:12px}.image-preview-panel>.image-zoom-view{display:flex;flex-direction:column;flex:1;min-height:0;margin:0}.image-preview-panel .image-scroll{flex:1}.image-preview-panel .image-tools,.image-preview-panel .image-zoom-hint{flex-shrink:0}
@media(max-width:350px){header{padding:14px}main{padding:0 12px 16px}.search{padding:10px 12px}nav{padding:10px 10px 0}.actions button{flex:1}}
</style></head><body>
<div id="panel-top">
<header><div><h1><span>▤</span>问答笔记</h1><p class="sub">留下有用的片段，随时查看出处</p></div><button id="refresh" class="icon" aria-label="刷新笔记" title="刷新" aria-busy="false"><span class="refresh-icon" aria-hidden="true">↻</span></button></header>
<nav aria-label="笔记导航"><button data-view="notes" class="active">我的笔记</button><button data-view="questions">问题记录</button><button data-view="capture">＋ 摘录</button></nav>
<div class="search" id="searchbox"><input id="search" aria-label="搜索笔记或问题" placeholder="搜索笔记或问题…"></div>
<p id="message" role="status" aria-live="polite">正在连接本地笔记…</p>
<section id="view-controls" aria-label="当前页面操作"></section>
</div>
<main id="content" tabindex="0" aria-label="笔记和问题内容"></main><footer id="counts">本地保存 · 原文副本保留在笔记里</footer>
<script>/*APP_BUNDLE*/</script></body></html>
